<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- White dog with pencil (for writing/notes) -->
  <g transform="translate(20,20)">
    <!-- Body -->
    <ellipse cx="75" cy="140" rx="48" ry="36" fill="white" stroke="#333" stroke-width="3"/>
    <!-- Head -->
    <circle cx="55" cy="78" r="32" fill="white" stroke="#333" stroke-width="3"/>
    <!-- Left ear -->
    <ellipse cx="28" cy="60" rx="12" ry="20" fill="white" stroke="#333" stroke-width="3" transform="rotate(-10,28,60)"/>
    <!-- Right ear -->
    <ellipse cx="82" cy="60" rx="12" ry="20" fill="white" stroke="#333" stroke-width="3" transform="rotate(10,82,60)"/>
    <!-- Eyes (focused) -->
    <circle cx="44" cy="75" r="4" fill="#333"/>
    <circle cx="45" cy="74" r="1.3" fill="white"/>
    <circle cx="66" cy="75" r="4" fill="#333"/>
    <circle cx="67" cy="74" r="1.3" fill="white"/>
    <!-- Nose -->
    <ellipse cx="55" cy="83" rx="3.5" ry="2.5" fill="#333"/>
    <!-- Mouth (determined) -->
    <path d="M50 88 Q55 91 60 88" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Front paws -->
    <ellipse cx="48" cy="164" rx="11" ry="8" fill="white" stroke="#333" stroke-width="3"/>
    <!-- Right paw holding pencil -->
    <g transform="translate(98,150)">
      <ellipse cx="5" cy="0" rx="10" ry="7" fill="white" stroke="#333" stroke-width="3"/>
      <!-- Pencil -->
      <rect x="8" y="-30" width="6" height="35" rx="1" fill="#FFD93D" stroke="#333" stroke-width="1.5" transform="rotate(15,11,-12)"/>
      <polygon points="8,5 14,5 11,12" fill="#FFB347" stroke="#333" stroke-width="1.5" transform="rotate(15,11,8)"/>
    </g>
    <!-- Tail -->
    <path d="M120 128 Q140 115 135 100" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Notebook -->
    <rect x="105" y="90" width="55" height="70" rx="5" fill="#E8F4FD" stroke="#333" stroke-width="2.5"/>
    <line x1="120" y1="90" x2="120" y2="160" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="130" y1="105" x2="150" y2="105" stroke="#A8D8EA" stroke-width="2" stroke-linecap="round"/>
    <line x1="130" y1="115" x2="148" y2="115" stroke="#A8D8EA" stroke-width="2" stroke-linecap="round"/>
    <line x1="130" y1="125" x2="145" y2="125" stroke="#A8D8EA" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>