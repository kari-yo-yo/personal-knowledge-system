<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- White fluffy dog waving -->
  <g transform="translate(30,20)">
    <!-- Body -->
    <ellipse cx="70" cy="140" rx="50" ry="40" fill="white" stroke="#333" stroke-width="3"/>
    <!-- Head -->
    <circle cx="70" cy="75" r="35" fill="white" stroke="#333" stroke-width="3"/>
    <!-- Left ear -->
    <ellipse cx="40" cy="55" rx="12" ry="20" fill="white" stroke="#333" stroke-width="3" transform="rotate(-15,40,55)"/>
    <!-- Right ear -->
    <ellipse cx="100" cy="55" rx="12" ry="20" fill="white" stroke="#333" stroke-width="3" transform="rotate(15,100,55)"/>
    <!-- Eyes (happy curves) -->
    <path d="M55 72 Q60 66 65 72" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M75 72 Q80 66 85 72" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Nose -->
    <ellipse cx="70" cy="80" rx="4" ry="3" fill="#333"/>
    <!-- Mouth -->
    <path d="M66 84 Q70 90 74 84" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Tongue -->
    <ellipse cx="70" cy="88" rx="3" ry="4" fill="#FF9CAD"/>
    <!-- Waving paw -->
    <g transform="translate(110,95) rotate(-30)">
      <ellipse cx="10" cy="0" rx="12" ry="8" fill="white" stroke="#333" stroke-width="3"/>
    </g>
    <!-- Front paws -->
    <ellipse cx="45" cy="165" rx="10" ry="8" fill="white" stroke="#333" stroke-width="3"/>
    <ellipse cx="95" cy="165" rx="10" ry="8" fill="white" stroke="#333" stroke-width="3"/>
    <!-- Tail -->
    <path d="M120 130 Q140 110 135 95" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Sparkles -->
    <path d="M20 40 L22 35 L24 40 L29 42 L24 44 L22 49 L20 44 L15 42 Z" fill="#FFD93D"/>
    <path d="M120 30 L122 26 L124 30 L128 32 L124 34 L122 38 L120 34 L116 32 Z" fill="#FFD93D" opacity="0.7"/>
  </g>
</svg>