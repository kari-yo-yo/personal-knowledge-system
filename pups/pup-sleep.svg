<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- White dog sleeping/relaxed -->
  <g transform="translate(20,30)">
    <!-- Body (lying flat) -->
    <ellipse cx="80" cy="130" rx="65" ry="30" fill="white" stroke="#333" stroke-width="3"/>
    <!-- Head -->
    <circle cx="35" cy="110" r="28" fill="white" stroke="#333" stroke-width="3"/>
    <!-- Left ear -->
    <ellipse cx="15" cy="95" rx="10" ry="18" fill="white" stroke="#333" stroke-width="3" transform="rotate(-10,15,95)"/>
    <!-- Right ear -->
    <ellipse cx="55" cy="95" rx="10" ry="18" fill="white" stroke="#333" stroke-width="3" transform="rotate(10,55,95)"/>
    <!-- Closed eyes -->
    <path d="M24 108 Q28 104 32 108" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M38 108 Q42 104 46 108" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Nose -->
    <ellipse cx="35" cy="115" rx="3" ry="2.5" fill="#333"/>
    <!-- Mouth (sleeping smile) -->
    <path d="M32 119 Q35 123 38 119" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Paws (stretched out) -->
    <ellipse cx="130" cy="128" rx="15" ry="8" fill="white" stroke="#333" stroke-width="3"/>
    <ellipse cx="150" cy="135" rx="8" ry="6" fill="white" stroke="#333" stroke-width="3"/>
    <!-- Tail -->
    <path d="M145 120 Q160 100 155 85" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Zzz -->
    <text x="60" y="85" font-family="sans-serif" font-size="14" fill="#A8D8EA" font-weight="bold">z</text>
    <text x="75" y="72" font-family="sans-serif" font-size="18" fill="#A8D8EA" font-weight="bold">z</text>
    <text x="92" y="55" font-family="sans-serif" font-size="22" fill="#A8D8EA" font-weight="bold">z</text>
  </g>
</svg>