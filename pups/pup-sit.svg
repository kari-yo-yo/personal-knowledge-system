<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Tan dog sitting -->
  <g transform="translate(30,20)">
    <!-- Body -->
    <ellipse cx="70" cy="145" rx="45" ry="35" fill="#F5D5A0" stroke="#333" stroke-width="3"/>
    <!-- Collar -->
    <rect x="50" y="105" width="40" height="8" rx="4" fill="#FF6B6B" stroke="#333" stroke-width="2"/>
    <!-- Head -->
    <circle cx="70" cy="75" r="32" fill="#F5D5A0" stroke="#333" stroke-width="3"/>
    <!-- Left ear (floppy) -->
    <ellipse cx="38" cy="60" rx="15" ry="22" fill="#E8C07A" stroke="#333" stroke-width="3" transform="rotate(-20,38,60)"/>
    <!-- Right ear (floppy) -->
    <ellipse cx="102" cy="60" rx="15" ry="22" fill="#E8C07A" stroke="#333" stroke-width="3" transform="rotate(20,102,60)"/>
    <!-- Eyes -->
    <circle cx="58" cy="72" r="3" fill="#333"/>
    <circle cx="82" cy="72" r="3" fill="#333"/>
    <!-- Eye sparkles -->
    <circle cx="59" cy="71" r="1" fill="white"/>
    <circle cx="83" cy="71" r="1" fill="white"/>
    <!-- Nose -->
    <ellipse cx="70" cy="80" rx="4" ry="3" fill="#333"/>
    <!-- Mouth -->
    <path d="M65 85 Q70 91 75 85" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Tongue -->
    <ellipse cx="70" cy="89" rx="3" ry="5" fill="#FF9CAD"/>
    <!-- Front paws -->
    <ellipse cx="45" cy="168" rx="12" ry="9" fill="#F5D5A0" stroke="#333" stroke-width="3"/>
    <ellipse cx="95" cy="168" rx="12" ry="9" fill="#F5D5A0" stroke="#333" stroke-width="3"/>
    <!-- Tail -->
    <path d="M115 135 Q130 120 125 105" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Heart -->
    <path d="M125 60 C125 55 132 52 135 58 C138 52 145 55 145 60 C145 68 135 75 135 75 C135 75 125 68 125 60 Z" fill="#FF9CAD"/>
  </g>
</svg>